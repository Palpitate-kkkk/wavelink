[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wavelink-lab"
version = "0.1.0"
description = "Reproducible OFDM and wireless propagation experiments"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3"]

[tool.setuptools.packages.find]
where = ["src"]
